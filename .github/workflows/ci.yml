name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run legacy tests
        run: npm test
        continue-on-error: true

      - name: Run Vitest tests
        run: npm run test:vitest

      - name: Generate coverage report
        run: npm run test:vitest -- --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Build production
        run: npm run build

      - name: Run linter
        run: npm run lint
        continue-on-error: true

    env:
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TEST_FAMILY_ID: ${{ secrets.TEST_FAMILY_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

# Secrets Configuration (optional):
# - TEST_USER_EMAIL: Test user email for live Supabase tests
# - TEST_USER_PASSWORD: Test user password for live Supabase tests
# - TEST_FAMILY_ID: UUID of test family for live Supabase tests
# - VITE_SUPABASE_URL: Supabase project URL
# - VITE_SUPABASE_ANON_KEY: Supabase anon key (public)
#
# When secrets are absent, live integration tests are safely skipped.
# CI will still pass with 312 tests passed + 8 skipped.
